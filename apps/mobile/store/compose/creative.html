<!doctype html>
<!--
  The product page's Header (21:9) and Search Results (3:2) creatives, rendered
  by compose.mjs at {{W}}×{{H}}. Sized in vh so the art scales with the canvas.
  Key art stays in the centre: the App Store crops the edges on smaller devices.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Serif"; src: url("{{SERIF}}"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("{{SERIF_ITALIC}}"); }
  @font-face { font-family: "Geist"; src: url("{{SANS}}"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url("{{SANS_MEDIUM}}"); }
  @font-face { font-family: "Geist"; font-weight: 600; src: url("{{SANS_SEMIBOLD}}"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body { position: relative; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }

  /* The landing page's hero, as on the indigo screenshots. */
  .bg, .dots, .layer { position: absolute; inset: 0; }
  .bg {
    background:
      radial-gradient(70vw 90vh at 10% -10%, #7466ff 0%, transparent 62%),
      radial-gradient(70vw 100vh at 100% 112%, rgba(236, 71, 100, 0.85) 0%, transparent 60%),
      radial-gradient(45vw 70vh at -8% 95%, rgba(0, 173, 157, 0.38) 0%, transparent 65%),
      linear-gradient(160deg, #3a2fc6 0%, #524ce3 45%, #7445cf 100%);
  }
  .dots { background-image: radial-gradient(rgba(255, 255, 255, 0.18) 0.17vh, transparent 0.21vh); background-size: 3.4vh 3.4vh;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 45%, #000 0%, transparent 100%); }
  .layer { --a1: #ffe08a; --a2: #ffb4c6; pointer-events: none; }
  .field-curves { position: absolute; inset: 0; width: 100%; height: 100%; }
  .glyph { color: #fff; }

  /* ---- Type, as the screenshots' headline ---- */
  .chip { display: inline-flex; align-items: center; gap: calc(var(--chip) * 0.48); padding: calc(var(--chip) * 0.42) calc(var(--chip) * 1.05) calc(var(--chip) * 0.42) calc(var(--chip) * 0.42);
    border-radius: 99vw; font-weight: 600; font-size: var(--chip); letter-spacing: -0.025em; line-height: 1;
    --fg: oklch(0.21 0.03 272); --primary: oklch(0.52 0.22 277); --chart-4: oklch(0.64 0.2 15); --on-primary: oklch(0.985 0.01 270);
    background: oklch(0.99 0.004 270 / 0.92); border: 0.12vh solid oklch(0.915 0.014 272); color: var(--fg); box-shadow: 0 1vh 3vh rgba(18, 14, 70, 0.2); }
  .chip .camp { color: var(--primary); }
  .mark { display: grid; place-items: center; width: calc(var(--chip) * 1.9); height: calc(var(--chip) * 1.9); border-radius: calc(var(--chip) * 0.71);
    background: linear-gradient(to bottom right, var(--primary), var(--chart-4)); color: var(--on-primary); }
  .mark svg { width: 62.5%; height: 62.5%; }
  h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: var(--h1); line-height: 1; letter-spacing: -0.015em; text-wrap: balance; }
  h1 em { font-style: italic; padding: 0 0.08em; margin: 0 -0.08em; -webkit-background-clip: text; background-clip: text; color: transparent; background-image: linear-gradient(90deg, #ffe08a, #ffb4c6); }
  p { font-size: var(--sub); line-height: 1.35; color: rgba(255, 255, 255, 0.82); text-wrap: balance; }

  /* ---- Header: headline in the centre, cards around it ---- */
  .header { --chip: 3.4vh; --h1: 15vh; --sub: 4.1vh; --u: 1.85vh; }
  .header .copy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2.8vh; width: 40vw; }
  .card.free { left: 0; top: 0; translate: -50% -50%; }
  .glow { position: absolute; left: 50%; top: 50%; width: 46vw; height: 70vh; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255, 255, 255, 0.14); filter: blur(8vh); }

  /* ---- Search Results: copy left, the app on the right ---- */
  .search { --chip: 2.7vh; --h1: 11.5vh; --sub: 3.1vh; --u: 1.25vh; }
  .search .copy { position: absolute; left: 15vw; top: 50%; transform: translateY(-50%); width: 34vw; display: flex; flex-direction: column; align-items: flex-start; gap: 2.6vh; }
  .search .glow { left: 66vw; width: 44vw; height: 90vh; }
  .device { position: absolute; left: 66vw; top: 8vh; transform: translateX(-50%) rotate(2deg); width: 39vh; padding: 0.95vh; border-radius: 6vh;
    background: linear-gradient(145deg, #3a3d4b 0%, #121319 22%, #0a0b10 60%, #2b2e3a 100%);
    box-shadow: inset 0 0 0 0.12vh rgba(255, 255, 255, 0.14), 0 4vh 10vh rgba(18, 14, 70, 0.45), 0 1.4vh 3vh rgba(18, 14, 70, 0.25); }
  .device img.screen { display: block; width: 100%; border-radius: 5.05vh; }
  .island { position: absolute; left: 50%; transform: translateX(-50%); top: calc(0.95vh + 1.25%); width: 25%; height: 2.7%; border-radius: 99vw; background: #000; }
  .search { --hang: -30%; }
  .search h1 { width: 37vw; }
  .search p { max-width: 27vw; }
  .device .card { transform: rotate(calc(var(--rot) - 2deg)); }
</style>
<link rel="stylesheet" href="{{ART_CSS}}" />
</head>
<body class="{{KIND}}">
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="layer">{{FIELD}}</div>
  <div class="glow"></div>
  {{BODY}}
</body>
</html>

<!doctype html>
<!--
  One App Store screenshot, rendered by compose.mjs at {{W}}×{{H}}. Sizes are in
  vw, so the same design scales to every device. Colours are the app's tokens
  (src/lib/theme.ts) and the landing page's hero: indigo to rose, dots, glows.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Serif"; src: url("{{SERIF}}"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("{{SERIF_ITALIC}}"); }
  @font-face { font-family: "Geist"; src: url("{{SANS}}"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url("{{SANS_MEDIUM}}"); }
  @font-face { font-family: "Geist"; font-weight: 600; src: url("{{SANS_SEMIBOLD}}"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body { position: relative; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---- Backgrounds ---- */
  .bg, .dots, .glow { position: absolute; inset: 0; }
  .indigo .bg {
    background:
      radial-gradient(110vw 80vw at 12% -5%, #7466ff 0%, transparent 62%),
      radial-gradient(100vw 90vw at 105% 108%, rgba(236, 71, 100, 0.85) 0%, transparent 60%),
      radial-gradient(70vw 60vw at -10% 85%, rgba(0, 173, 157, 0.35) 0%, transparent 65%),
      linear-gradient(165deg, #3a2fc6 0%, #524ce3 45%, #7445cf 100%);
  }
  .aurora .bg {
    background:
      radial-gradient(90vw 70vw at 8% -4%, rgba(82, 76, 227, 0.26) 0%, transparent 65%),
      radial-gradient(70vw 70vw at 100% 22%, rgba(0, 173, 157, 0.16) 0%, transparent 65%),
      radial-gradient(100vw 80vw at 60% 110%, rgba(236, 71, 100, 0.14) 0%, transparent 65%),
      #fbfcff;
  }
  .night .bg {
    background:
      radial-gradient(100vw 80vw at 15% -5%, rgba(146, 150, 255, 0.36) 0%, transparent 62%),
      radial-gradient(90vw 80vw at 105% 105%, rgba(249, 102, 122, 0.28) 0%, transparent 62%),
      radial-gradient(60vw 50vw at -5% 70%, rgba(4, 197, 181, 0.16) 0%, transparent 65%),
      #0a0b15;
  }
  .dots { background-size: 3.2vw 3.2vw; -webkit-mask-image: radial-gradient(ellipse 85% 45% at 50% 0%, #000 0%, transparent 100%); }
  .indigo .dots { background-image: radial-gradient(rgba(255, 255, 255, 0.2) 0.16vw, transparent 0.19vw); }
  .aurora .dots { background-image: radial-gradient(rgba(82, 76, 227, 0.16) 0.16vw, transparent 0.19vw); }
  .night .dots { background-image: radial-gradient(rgba(255, 255, 255, 0.1) 0.16vw, transparent 0.19vw); }

  /* ---- Headline ---- */
  header { position: absolute; left: 0; right: 0; top: var(--top); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 7vw; }
  /*
   * The site header's logo (apps/web/src/components/app/logo.tsx): the mark, a
   * rounded square from primary to chart-4 with the rising line, then the name in
   * Geist semibold, tracking-tight, "Camp" in primary. It sits on a pill of the
   * header's own glass so the colours read as they do on the site.
   */
  .chip { display: inline-flex; align-items: center; gap: calc(var(--chip) * 0.48); padding: calc(var(--chip) * 0.42) calc(var(--chip) * 1.05) calc(var(--chip) * 0.42) calc(var(--chip) * 0.42);
    border-radius: 99vw; font-weight: 600; font-size: var(--chip); letter-spacing: -0.025em; line-height: 1;
    --fg: oklch(0.21 0.03 272); --primary: oklch(0.52 0.22 277); --chart-4: oklch(0.64 0.2 15); --on-primary: oklch(0.985 0.01 270);
    background: oklch(0.99 0.004 270 / 0.9); border: 0.12vw solid oklch(0.915 0.014 272); color: var(--fg);
    box-shadow: 0 0.6vw 2vw rgba(18, 14, 70, 0.16); }
  .chip .camp { color: var(--primary); }
  .mark { display: grid; place-items: center; width: calc(var(--chip) * 1.9); height: calc(var(--chip) * 1.9); border-radius: calc(var(--chip) * 0.71);
    background: linear-gradient(to bottom right, var(--primary), var(--chart-4)); color: var(--on-primary);
    box-shadow: 0 calc(var(--chip) * 0.06) calc(var(--chip) * 0.12) color-mix(in oklch, var(--primary) 30%, transparent); }
  .mark svg { width: 62.5%; height: 62.5%; }
  /* Dark mode, as the site's .dark tokens. */
  .night .chip { --fg: oklch(0.96 0.01 272); --primary: oklch(0.72 0.16 280); --chart-4: oklch(0.7 0.18 15); --on-primary: oklch(0.17 0.03 276);
    background: oklch(0.155 0.02 276 / 0.78); border-color: oklch(1 0 0 / 0.12); box-shadow: 0 0.6vw 2vw rgba(0, 0, 0, 0.35); }
  h1 { max-width: var(--h1max, 86vw); margin-top: var(--gap); font-family: "Instrument Serif", serif; font-weight: 400; font-size: var(--h1); line-height: 1.02; letter-spacing: -0.015em; text-wrap: balance; }
  h1 em { font-style: italic; padding: 0 0.08em; margin: 0 -0.08em; -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: calc(var(--gap) * 0.8); font-size: var(--sub); line-height: 1.35; text-wrap: balance; }

  .indigo, .night { color: #fff; }
  .indigo h1 em { background-image: linear-gradient(90deg, #ffe08a, #ffb4c6); }
  .night h1 em { background-image: linear-gradient(90deg, #9296ff, #f9667a); }
  .indigo p, .night p { color: rgba(255, 255, 255, 0.8); }
  .aurora { color: #131726; }
  .aurora h1 em { background-image: linear-gradient(90deg, #524ce3, #ec4764); }
  .aurora p { color: #5d6375; }

  /* ---- Devices ---- */
  .device { position: absolute; left: 50%; transform: translateX(-50%); padding: var(--bezel); border-radius: var(--r);
    background: linear-gradient(145deg, #3a3d4b 0%, #121319 22%, #0a0b10 60%, #2b2e3a 100%);
    box-shadow: inset 0 0 0 0.18vw rgba(255, 255, 255, 0.14), 0 3vw 8vw rgba(18, 14, 70, 0.38), 0 1vw 2.4vw rgba(18, 14, 70, 0.22); }
  .device img.screen { display: block; width: 100%; border-radius: calc(var(--r) - var(--bezel)); }
  .night .device { box-shadow: inset 0 0 0 0.18vw rgba(255, 255, 255, 0.16), 0 3vw 10vw rgba(146, 150, 255, 0.22), 0 1vw 3vw rgba(0, 0, 0, 0.5); }
  .island { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--bezel) + 1.25%); width: 25%; height: 2.7%; border-radius: 99vw; background: #000; }
  /* A glow behind each device, so it lifts off the background. */
  .halo { position: absolute; left: 50%; transform: translateX(-50%); width: 110vw; height: 70vw; bottom: -20vw; border-radius: 50%; filter: blur(6vw); }
  .indigo .halo { background: rgba(255, 255, 255, 0.18); }
  .aurora .halo { background: rgba(82, 76, 227, 0.16); }
  .night .halo { background: rgba(146, 150, 255, 0.14); }


  /* ---- Generated art (art.mjs) ---- */
  /* The header's backdrop: glyphs around the headline, curves above the device. */
  .art-head { position: absolute; left: 0; right: 0; top: 0; height: var(--hh); pointer-events: none; }
  .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .glyph { position: absolute; font-family: "Instrument Serif", serif; font-style: italic; line-height: 1; white-space: nowrap; }
  .indigo .art-head { --a1: #ffe08a; --a2: #ffb4c6; } .indigo .glyph { color: #fff; }
  .aurora .art-head { --a1: #524ce3; --a2: #ec4764; } .aurora .glyph { color: #524ce3; }
  .night .art-head { --a1: #9296ff; --a2: #f9667a; } .night .glyph { color: #b9bcff; }
  .indigo .glyph { opacity: 0.5; } .backdrop .c1 { opacity: 0.9; } .backdrop .c2 { opacity: 0.5; }

  /* Cards hanging off the device's edges, in the app's light (or, at night, dark) tokens. */
  .card { position: absolute; z-index: 2; font-size: var(--u); padding: 1.3em 1.5em; border-radius: 1.7em; min-width: 13em;
    --card: oklch(1 0 0); --fg: oklch(0.21 0.03 272); --mfg: oklch(0.5 0.03 272); --muted: oklch(0.94 0.012 272); --border: oklch(0.915 0.014 272);
    --primary: oklch(0.52 0.22 277); --chart-1: oklch(0.55 0.22 277); --chart-2: oklch(0.66 0.14 185); --chart-3: oklch(0.76 0.16 70); --chart-4: oklch(0.64 0.2 15); --success: oklch(0.62 0.16 158); --warning: oklch(0.74 0.16 68);
    background: var(--card); color: var(--fg); border: 0.1em solid var(--border);
    box-shadow: 0 2.4em 5em -1em rgba(18, 14, 70, 0.38), 0 0.6em 1.4em rgba(18, 14, 70, 0.14);
    transform: rotate(var(--rot)); }
  .night .card { --card: oklch(0.205 0.026 276); --fg: oklch(0.96 0.01 272); --mfg: oklch(0.7 0.03 272); --muted: oklch(0.28 0.025 276); --border: oklch(1 0 0 / 12%);
    --primary: oklch(0.72 0.16 280); --chart-1: oklch(0.72 0.16 280); --chart-2: oklch(0.74 0.13 185); --chart-3: oklch(0.8 0.14 72); --chart-4: oklch(0.7 0.18 15); --success: oklch(0.72 0.15 158); --warning: oklch(0.8 0.14 72);
    box-shadow: 0 2.4em 5em -1em rgba(0, 0, 0, 0.6), 0 0 4em rgba(146, 150, 255, 0.18); }
  .card.left { left: var(--hang); } .card.right { right: var(--hang); }
  .card svg { display: block; }
  .card .row { display: flex; align-items: center; gap: 1em; }
  .card .t { font-weight: 600; font-size: 1.45em; letter-spacing: -0.02em; line-height: 1.15; }
  .card .t.big { font-size: 2.6em; letter-spacing: -0.03em; line-height: 1; }
  .card .s { margin-top: 0.25em; font-size: 1.05em; color: var(--mfg); }
  .card .eyebrow { font-size: 0.85em; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-bottom: 0.7em; }
  .card .tex { font-family: "Instrument Serif", serif; font-size: 1.75em; line-height: 1.1; white-space: nowrap; }
  .card .foot { margin-top: 0.4em; text-align: center; color: var(--mfg); }
  .card .foot .tex { font-size: 1.5em; }
  .card text { font-family: "Geist", sans-serif; fill: var(--fg); }
  .card text.n { font-size: 15px; font-weight: 500; } .card text.lbl { font-size: 13px; font-weight: 600; fill: var(--mfg); } .card text.pct { font-size: 15px; font-weight: 600; }
  .w-area { width: 17em; } .w-ring { width: 5.6em; } .w-plot { width: 15em; } .w-pie { width: 6.2em; } .w-bars { width: 14em; } .w-graph { width: 17em; }
  .card .g { stroke: var(--border); stroke-width: 1; } .card .ax { stroke: var(--mfg); stroke-opacity: 0.55; stroke-width: 1.4; } .card .edge { stroke: var(--border); stroke-width: 3; }
  .card .frac .tex { display: inline-flex; flex-direction: column; align-items: center; font-size: 2.6em; line-height: 0.95; }
  .card .frac .num { border-bottom: 0.05em solid currentColor; padding: 0 0.12em; }
  .card .badge { display: grid; place-items: center; width: 3.6em; height: 3.6em; border-radius: 1.1em; flex: none; color: #fff; }
  .card .badge svg { width: 55%; height: 55%; }
  .card .badge.ok { background: var(--success); box-shadow: 0 0.5em 1.2em color-mix(in oklch, var(--success) 45%, transparent); }
  .card .badge.star { background: linear-gradient(160deg, var(--primary), var(--chart-4)); box-shadow: 0 0.5em 1.2em color-mix(in oklch, var(--primary) 40%, transparent); }
  .card .rank { display: flex; align-items: center; gap: 0.8em; padding: 0.5em 0.7em; border-radius: 0.9em; font-size: 1.15em; }
  .card .rank + .rank { margin-top: 0.2em; }
  .card .rank.me { background: color-mix(in oklch, var(--primary) 12%, transparent); color: var(--primary); font-weight: 600; }
  .card .rank .p { width: 1.2em; font-weight: 600; color: var(--mfg); } .card .rank.me .p { color: var(--primary); }
  .card .rank .nm { flex: 1; } .card .rank .xp { font-variant-numeric: tabular-nums; color: var(--mfg); } .card .rank.me .xp { color: var(--primary); }

  .phone { --hh: 54.5vw; --gs: 1vw; --u: 2vw; --hang: -13%; --h1max: 80vw; --top: 6.5vw; --chip: 3.4vw; --h1: 11vw; --sub: 3.7vw; --gap: 2.4vw; }
  .phone .device { width: 72.5vw; top: 54.5vw; --bezel: 1.7vw; --r: 10.6vw; }

  .tablet { --hh: 28.5vw; --gs: 0.55vw; --u: 1.15vw; --hang: -9%; --top: 4.6vw; --chip: 2vw; --h1: 6.4vw; --sub: 2.3vw; --gap: 1.6vw; }
  .tablet .device { width: 77vw; top: 28.5vw; --bezel: 1.5vw; --r: 3.6vw; }

  .duo { --hh: 38vw; --gs: 0.75vw; --u: 1.6vw; --hang: -12%; --top: 6vw; --chip: 2.8vw; --h1: 8vw; --sub: 3vw; --gap: 2.2vw; }
  .duo .device { width: 70vw; top: 38vw; --bezel: 1.5vw; --r: 5.4vw; }

  .tablet .island, .duo .island { display: none; }
</style>
</head>
<body class="{{FRAME}} {{THEME}}">
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="halo"></div>
  <div class="art-head">{{BACKDROP}}</div>
  <header>
    <span class="chip"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 18 L10 6 L14 14 L20 4" /><circle cx="20" cy="4" r="2.3" fill="currentColor" stroke="none" /></svg></span><span>FreeMath<span class="camp">Camp</span></span></span>
    <h1>{{TITLE}}</h1>
    <p>{{SUB}}</p>
  </header>
  <div class="device">
    <img class="screen" src="{{SCREEN}}" alt="" />
    <div class="island"></div>
    {{CARDS}}
  </div>
</body>
</html>

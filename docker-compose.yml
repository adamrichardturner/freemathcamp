# Development stack: Postgres + API with hot reload.
#   docker compose up            → db on 127.0.0.1:5433, API on 127.0.0.1:4100
#   docker compose up -d db      → just the database (run the API natively with `pnpm dev`)
# Secrets come from ./.env (git-ignored); see .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fmc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/package.json:/repo/apps/api/package.json:ro
      - ./packages/curriculum/src:/repo/packages/curriculum/src
      - ./tsconfig.base.json:/repo/tsconfig.base.json:ro
    profiles: ["api"]

volumes:
  fmc-db:
